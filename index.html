<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MemoAI">
<meta name="theme-color" content="#0f0f13">
<title>MemoAI 智能记事</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c6af7'/><text y='.9em' font-size='70' x='15'>📝</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222e;--surface3:#2a2a38;
    --accent:#7c6af7;--accent2:#a594fa;--text:#f0eeff;--text2:#a09cc0;--text3:#6a6688;
    --green:#4ade80;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--pink:#f472b6;
    --radius:14px;--radius-sm:8px;
  }
  body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;overflow-x:hidden}

  .header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:22px;font-weight:700;letter-spacing:-0.5px}
  .logo span{color:var(--accent2)}
  .header-actions{display:flex;gap:10px}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
  .icon-btn:hover{background:var(--surface3);color:var(--text)}

  .search-bar{margin:16px 20px 0;position:relative}
  .search-bar input{width:100%;background:var(--surface2);border:1px solid #ffffff0f;border-radius:12px;padding:11px 16px 11px 42px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
  .search-bar input:focus{border-color:#7c6af740}
  .search-bar input::placeholder{color:var(--text3)}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}

  .cats{display:flex;gap:8px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:all .2s;background:var(--surface2);color:var(--text2)}
  .cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .notes{flex:1;padding:16px 20px 100px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}

  .note{background:var(--surface);border:1px solid #ffffff08;border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .note:hover{background:var(--surface2);border-color:#ffffff14}
  .note::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
  .note.account::before{background:var(--blue)}
  .note.finance::before{background:var(--green)}
  .note.todo::before{background:var(--amber)}
  .note.health::before{background:var(--pink)}
  .note.general::before{background:var(--accent)}

  .note-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
  .note-category{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase}
  .cat-account{background:#60a5fa18;color:var(--blue)}
  .cat-finance{background:#4ade8018;color:var(--green)}
  .cat-todo{background:#fbbf2418;color:var(--amber)}
  .cat-health{background:#f472b618;color:var(--pink)}
  .cat-general{background:#7c6af718;color:var(--accent2)}

  .note-time{font-size:11px;color:var(--text3)}
  .note-title{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.4}
  .note-body{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .note-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11px;padding:3px 8px;background:var(--surface3);color:var(--text3);border-radius:6px}

  .secret-field{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--surface2);padding:8px 12px;border-radius:8px;font-size:12px}
  .secret-label{color:var(--text3);min-width:52px}
  .secret-val{color:var(--text);font-family:monospace;flex:1;letter-spacing:.5px}
  .copy-btn{font-size:13px;cursor:pointer;padding:2px 6px;border-radius:5px;background:#7c6af718;border:none;color:var(--accent2)}

  .fab-row{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:16px 20px 34px;display:flex;justify-content:center;gap:16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:100}
  .fab{width:56px;height:56px;border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .2s}
  .fab:active{transform:scale(.93)}
  .fab-main{width:68px;height:68px;background:var(--accent);border-radius:20px;box-shadow:0 8px 32px #7c6af755}
  .fab-voice{background:var(--surface2)}
  .fab-photo{background:var(--surface2)}
  .fab-voice.recording{background:#f8717120;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f8717140}50%{box-shadow:0 0 0 12px transparent}}

  .modal-bg{position:fixed;inset:0;background:#000000cc;z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  .modal-bg.show{opacity:1;pointer-events:all}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px 40px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
  .modal-bg.show .modal{transform:translateY(0)}
  .modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:0 auto 20px}
  .modal-title{font-size:18px;font-weight:700;margin-bottom:20px}

  .input-group{margin-bottom:16px}
  .input-group label{font-size:12px;color:var(--text3);font-weight:500;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .input-group input,.input-group textarea,.input-group select{width:100%;background:var(--surface2);border:1px solid #ffffff10;border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
  .input-group input:focus,.input-group textarea:focus{border-color:#7c6af750}
  .input-group textarea{resize:none;height:90px;line-height:1.5}
  .input-group select{cursor:pointer;-webkit-appearance:none}

  .ai-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent2);padding:10px 14px;background:#7c6af710;border-radius:10px;margin-bottom:16px}
  .ai-dot{width:8px;height:8px;background:var(--accent2);border-radius:50%;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2)}
  .btn-secondary{background:var(--surface2);color:var(--text2);margin-top:10px}

  .voice-ui{display:flex;flex-direction:column;align-items:center;padding:20px 0}
  .voice-ring{width:100px;height:100px;border-radius:50%;background:#f8717115;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;cursor:pointer;margin-bottom:20px}
  .voice-ring.active::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--red);animation:ring 1.5s infinite;opacity:.6}
  @keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
  .voice-text{font-size:14px;color:var(--text2);text-align:center;max-height:80px;overflow-y:auto;line-height:1.6;padding:0 10px}

  .photo-preview{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--surface2);min-height:80px;display:flex;align-items:center;justify-content:center}
  .photo-preview img{width:100%;display:block;border-radius:12px}
  .photo-placeholder{color:var(--text3);font-size:13px}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text3)}
  .empty-icon{font-size:48px;opacity:.4}
  .empty-text{font-size:14px;text-align:center;line-height:1.6}

  .detail-view{padding:20px 20px 100px;overflow-y:auto}
  .detail-back{display:flex;align-items:center;gap:8px;color:var(--accent2);font-size:14px;cursor:pointer;margin-bottom:20px}
  .detail-title{font-size:22px;font-weight:700;margin-bottom:8px;line-height:1.3}
  .detail-body{font-size:15px;color:var(--text2);line-height:1.8}
  .detail-fields{margin-top:20px;display:flex;flex-direction:column;gap:10px}

  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}

  .apikey-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
  .apikey-logo{font-size:48px;margin-bottom:16px}
  .apikey-title{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
  .apikey-desc{font-size:14px;color:var(--text2);text-align:center;line-height:1.7;margin-bottom:28px}
  .apikey-input-wrap{width:100%;max-width:400px;position:relative;margin-bottom:12px}
  .apikey-input-wrap input{width:100%;background:var(--surface2);border:1px solid #ffffff15;border-radius:12px;padding:14px 46px 14px 16px;color:var(--text);font-size:14px;outline:none;font-family:monospace;letter-spacing:.3px;transition:border .2s}
  .apikey-input-wrap input:focus{border-color:#7c6af760}
  .apikey-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px}
  .apikey-hint{font-size:12px;color:var(--text3);text-align:center;margin-bottom:24px;line-height:1.6}
  .apikey-hint a{color:var(--accent2);text-decoration:none}
  .apikey-btn{width:100%;max-width:400px;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:all .2s}
  .apikey-btn:hover{background:var(--accent2)}
  .apikey-skip{margin-top:12px;font-size:13px;color:var(--text3);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<!-- API Key Screen -->
<div class="apikey-screen" id="apikeyScreen" style="display:none">
  <div class="apikey-logo">🤖</div>
  <div class="apikey-title">设置 API Key</div>
  <div class="apikey-desc">MemoAI 使用 Claude AI 自动分类笔记、识别账号密码。<br>请填入你的 Anthropic API Key 以启用 AI 功能。</div>
  <div class="apikey-input-wrap">
    <input type="password" id="apikeyInput" placeholder="sk-ant-api03-..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="apikey-eye" onclick="toggleApiKeyVis()" id="apiEyeBtn">👁</button>
  </div>
  <div class="apikey-hint">
    在 <a href="https://console.anthropic.com/keys" target="_blank">console.anthropic.com/keys</a> 获取 Key<br>
    Key 仅保存在你的设备本地，不会上传
  </div>
  <button class="apikey-btn" onclick="saveApiKey()">保存并开始使用</button>
  <div class="apikey-skip" onclick="skipApiKey()">暂不设置，使用基础模式</div>
</div>

<div id="app">
  <div id="list-view">
    <div class="header">
      <div class="logo">Memo<span>AI</span></div>
      <div class="header-actions">
        <div style="display:flex;align-items:center;gap:6px;padding:0 4px">
          <div id="syncDot" title="同步状态" style="width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s;cursor:default"></div>
        </div>
        <button class="icon-btn" onclick="showStats()">📊</button>
        <button class="icon-btn" onclick="openApiKeySetting()" title="API 设置" id="keyBtn">🔑</button>
      </div>
    </div>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="搜索笔记..." id="search" oninput="filterNotes()">
    </div>

    <div class="cats" id="cats">
      <div class="cat active" onclick="filterCat('all',this)">全部</div>
      <div class="cat" onclick="filterCat('account',this)">🔐 账号</div>
      <div class="cat" onclick="filterCat('finance',this)">💰 财务</div>
      <div class="cat" onclick="filterCat('todo',this)">✅ 待办</div>
      <div class="cat" onclick="filterCat('health',this)">❤️ 健康</div>
      <div class="cat" onclick="filterCat('general',this)">📝 笔记</div>
    </div>

    <div id="notes-list" class="notes"></div>

    <div class="fab-row">
      <button class="fab fab-voice" id="voiceBtn" onclick="openVoice()" title="语音记录">🎤</button>
      <button class="fab fab-main" onclick="openNew()" title="新建笔记">✏️</button>
      <button class="fab fab-photo" onclick="openPhoto()" title="拍照识别">📷</button>
    </div>
  </div>

  <div id="detail-view" style="display:none" class="detail-view">
    <div class="detail-back" onclick="backToList()">‹ 返回</div>
    <div id="detail-content"></div>
    <div style="margin-top:30px">
      <button class="btn" style="background:#f8717120;color:var(--red)" onclick="deleteNote()">🗑️ 删除此笔记</button>
    </div>
  </div>
</div>

<!-- New/Edit Modal -->
<div class="modal-bg" id="newModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">新建笔记</div>
    <div class="ai-status" id="aiStatus" style="display:none">
      <div class="ai-dot"></div>
      <span id="aiStatusText">AI 正在分析内容...</span>
    </div>
    <div class="input-group">
      <label>标题</label>
      <input type="text" id="noteTitle" placeholder="输入标题...">
    </div>
    <div class="input-group">
      <label>内容</label>
      <textarea id="noteBody" placeholder="记录任何内容，AI 会自动识别账号密码、待办事项等..."></textarea>
    </div>
    <div class="input-group">
      <label>分类（AI 会自动判断）</label>
      <select id="noteCat">
        <option value="general">📝 通用笔记</option>
        <option value="account">🔐 账号密码</option>
        <option value="finance">💰 财务</option>
        <option value="todo">✅ 待办事项</option>
        <option value="health">❤️ 健康记录</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="analyzeAndSave()">🤖 AI 分析并保存</button>
    <button class="btn btn-secondary" onclick="closeModal('newModal')">取消</button>
  </div>
</div>

<!-- Voice Modal -->
<div class="modal-bg" id="voiceModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">语音记录</div>
    <div class="voice-ui">
      <div class="voice-ring" id="voiceRing" onclick="toggleVoice()">🎤</div>
      <div id="voiceStatus" style="font-size:13px;color:var(--text3);margin-bottom:12px">点击开始录音</div>
      <div class="voice-text" id="voiceText">录音内容将显示在这里...</div>
    </div>
    <div class="ai-status" id="voiceAiStatus" style="display:none">
      <div class="ai-dot"></div>
      <span id="voiceAiText">AI 正在理解语音内容...</span>
    </div>
    <button class="btn btn-primary" id="voiceSaveBtn" style="display:none" onclick="saveVoiceNote()">保存此笔记</button>
    <button class="btn btn-secondary" onclick="closeModal('voiceModal');stopVoice()">关闭</button>
  </div>
</div>

<!-- Photo Modal -->
<div class="modal-bg" id="photoModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">拍照识别</div>
    <div class="photo-preview" id="photoPreview">
      <div class="photo-placeholder">📷 点击下方选择或拍摄图片</div>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
    <div class="ai-status" id="photoAiStatus" style="display:none">
      <div class="ai-dot"></div>
      <span id="photoAiText">AI 正在识别图片内容...</span>
    </div>
    <div id="photoResult" style="display:none">
      <div class="input-group" style="margin-top:12px">
        <label>识别结果（可编辑）</label>
        <textarea id="photoResultText" style="height:100px;background:var(--surface2);border:1px solid #fff1;border-radius:10px;padding:12px;color:var(--text);font-size:13px;width:100%;outline:none;resize:none;font-family:inherit"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('photoInput').click()">📷 选择 / 拍摄图片</button>
    <button class="btn btn-secondary" id="photoSaveBtn" style="display:none" onclick="savePhotoNote()">✅ 保存识别结果</button>
    <button class="btn btn-secondary" onclick="closeModal('photoModal')">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let notes = JSON.parse(localStorage.getItem('memoai_notes')||'[]');
let currentCat = 'all';
let currentNoteId = null;
let voiceRecognition = null;
let isRecording = false;
let voiceTranscript = '';
let photoBase64 = '';
let editingId = null;

function getApiKey(){return localStorage.getItem('memoai_apikey')||'';}

function checkApiKey(){
  if(!getApiKey()){
    document.getElementById('apikeyScreen').style.display='flex';
  }
}

function toggleApiKeyVis(){
  const inp=document.getElementById('apikeyInput');
  const btn=document.getElementById('apiEyeBtn');
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁';}
}

async function saveApiKey(){
  const val=document.getElementById('apikeyInput').value.trim();
  if(!val || val.length < 20){alert('请粘贴完整的 API Key');return;}
  const btn=document.querySelector('.apikey-btn');
  btn.textContent='验证中...';btn.disabled=true;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':val,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:10,messages:[{role:'user',content:'hi'}]})
    });
    if(resp.status===401){
      alert('API Key 无效，请检查是否复制完整');
      btn.textContent='保存并开始使用';btn.disabled=false;return;
    }
  }catch(e){}
  localStorage.setItem('memoai_apikey',val);
  document.getElementById('apikeyScreen').style.display='none';
  document.getElementById('keyBtn').style.background='#4ade8020';
  toast('✓ API Key 已保存，AI 功能已启用');
  btn.textContent='保存并开始使用';btn.disabled=false;
}

function skipApiKey(){
  document.getElementById('apikeyScreen').style.display='none';
  toast('已进入基础模式，分类需手动选择');
}

function openApiKeySetting(){
  const cur=getApiKey();
  document.getElementById('apikeyInput').value=cur?cur:'';
  document.getElementById('apikeyInput').type='password';
  document.getElementById('apiEyeBtn').textContent='👁';
  document.getElementById('apikeyScreen').style.display='flex';
}

const CATEGORIES = {
  account:{label:'账号密码',color:'cat-account',emoji:'🔐'},
  finance:{label:'财务',color:'cat-finance',emoji:'💰'},
  todo:{label:'待办事项',color:'cat-todo',emoji:'✅'},
  health:{label:'健康',color:'cat-health',emoji:'❤️'},
  general:{label:'笔记',color:'cat-general',emoji:'📝'}
};

if(!notes.length){
  notes=[
    {id:1,title:'Gmail 账号',category:'account',body:'工作邮箱，用于日常办公',time:'06-01 09:23',account:'work@gmail.com',password:'Wk#2025@secure',tags:['邮箱','工作']},
    {id:2,title:'本周待办',category:'todo',body:'- 完成项目报告\n- 联系客户 A\n- 预约牙医\n- 更新简历',time:'06-01 08:00',account:'',password:'',tags:['工作','本周']},
    {id:3,title:'晨跑记录',category:'health',body:'5km，用时 28 分钟，心率 145bpm，状态不错。',time:'05-31 07:30',account:'',password:'',tags:['运动']},
  ];
  save();
}

// ── 云端同步 ──────────────────────────────
let syncTimer = null;
let isSyncing = false;

function save(){
  localStorage.setItem('memoai_notes', JSON.stringify(notes));
  // 防抖：1.5秒内多次操作只同步一次
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToCloud, 1500);
}

async function syncToCloud(){
  if(isSyncing) return;
  isSyncing = true;
  setSyncStatus('syncing');
  try{
    const resp = await fetch('/api/notes', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({notes})
    });
    if(resp.ok){ setSyncStatus('ok'); }
    else { setSyncStatus('err'); }
  }catch(e){ setSyncStatus('err'); }
  isSyncing = false;
}

async function loadFromCloud(){
  setSyncStatus('syncing');
  try{
    const resp = await fetch('/api/notes');
    if(!resp.ok) throw new Error();
    const data = await resp.json();
    if(data.notes && data.notes.length > 0){
      // 云端有数据则用云端，否则保留本地
      notes = data.notes;
      localStorage.setItem('memoai_notes', JSON.stringify(notes));
    }
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('err');
  }
  renderNotes();
}

function setSyncStatus(state){
  const el = document.getElementById('syncDot');
  if(!el) return;
  el.title = state==='ok'?'已同步':state==='syncing'?'同步中...':'同步失败，使用本地数据';
  el.style.background = state==='ok'?'var(--green)':state==='syncing'?'var(--amber)':'var(--red)';
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);
}

function renderNotes(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=notes.filter(n=>{
    const matchCat=currentCat==='all'||n.category===currentCat;
    const matchQ=!q||(n.title+n.body+(n.tags||[]).join('')).toLowerCase().includes(q);
    return matchCat&&matchQ;
  }).sort((a,b)=>b.id-a.id);

  const el=document.getElementById('notes-list');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">暂无笔记<br>点击下方按钮添加</div></div>`;
    return;
  }
  el.innerHTML=list.map(n=>`
    <div class="note ${n.category}" onclick="showNote(${n.id})">
      <div class="note-header">
        <span class="note-category ${CATEGORIES[n.category].color}">${CATEGORIES[n.category].emoji} ${CATEGORIES[n.category].label}</span>
        <span class="note-time">${n.time}</span>
      </div>
      <div class="note-title">${n.title}</div>
      <div class="note-body">${n.body.replace(/\n/g,'<br>')}</div>
      ${n.account?`<div class="secret-field"><span class="secret-label">账号</span><span class="secret-val">${n.account}</span></div>`:''}
      ${n.password?`<div class="secret-field"><span class="secret-label">密码</span><span class="secret-val">••••••••</span><button class="copy-btn" onclick="event.stopPropagation();copyText('${n.password}')">复制</button></div>`:''}
      ${(n.tags||[]).length?`<div class="note-tags">${n.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`:''}
    </div>
  `).join('');
}

function showNote(id){
  currentNoteId=id;
  const n=notes.find(x=>x.id===id);
  if(!n) return;
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.getElementById('detail-content').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span class="note-category ${CATEGORIES[n.category].color}">${CATEGORIES[n.category].emoji} ${CATEGORIES[n.category].label}</span>
      <span style="font-size:12px;color:var(--text3)">${n.time}</span>
    </div>
    <div class="detail-title">${n.title}</div>
    <div class="detail-body" style="margin-top:12px">${n.body.replace(/\n/g,'<br>')}</div>
    ${n.account||n.password?`<div class="detail-fields">
      ${n.account?`<div class="secret-field"><span class="secret-label">账号</span><span class="secret-val">${n.account}</span><button class="copy-btn" onclick="copyText('${n.account}')">复制</button></div>`:''}
      ${n.password?`<div class="secret-field"><span class="secret-label">密码</span><span class="secret-val" id="pwdDisplay">••••••••</span><button class="copy-btn" onclick="togglePwd('${n.password}')">查看</button><button class="copy-btn" onclick="copyText('${n.password}')" style="margin-left:4px">复制</button></div>`:''}
    </div>`:''}
    ${(n.tags||[]).length?`<div class="note-tags" style="margin-top:16px">${n.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`:''}
  `;
}

function backToList(){
  document.getElementById('list-view').style.display='block';
  document.getElementById('detail-view').style.display='none';
}

function deleteNote(){
  if(!confirm('确认删除这条笔记？')) return;
  notes=notes.filter(n=>n.id!==currentNoteId);
  save();backToList();renderNotes();
}

function togglePwd(pwd){
  const el=document.getElementById('pwdDisplay');
  el.textContent=el.textContent==='••••••••'?pwd:'••••••••';
}

function copyText(t){
  navigator.clipboard.writeText(t).then(()=>toast('✓ 已复制到剪贴板')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=t;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    toast('✓ 已复制');
  });
}

function filterCat(cat,el){
  currentCat=cat;
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderNotes();
}

function filterNotes(){renderNotes()}

function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}

function openNew(){
  editingId=null;
  document.getElementById('modalTitle').textContent='新建笔记';
  document.getElementById('noteTitle').value='';
  document.getElementById('noteBody').value='';
  document.getElementById('noteCat').value='general';
  document.getElementById('aiStatus').style.display='none';
  openModal('newModal');
}

async function analyzeAndSave(){
  const title=document.getElementById('noteTitle').value.trim();
  const body=document.getElementById('noteBody').value.trim();
  if(!title&&!body){alert('请输入标题或内容');return;}

  const aiStatus=document.getElementById('aiStatus');
  const aiStatusText=document.getElementById('aiStatusText');
  aiStatus.style.display='flex';
  aiStatusText.textContent='AI 正在分析内容...';

  try{
    const prompt=`分析以下笔记内容，提取关键信息。严格按JSON返回，不要任何其他文字：
内容："${title} ${body}"

返回格式：
{"category":"account|finance|todo|health|general","title":"建议标题","summary":"内容摘要","account":"账号（如有）","password":"密码（如有）","tags":["标签1","标签2"]}

规则：
- 含账号/密码/登录信息 → account
- 含金额/花费/收入/报销 → finance
- 含待办/任务/计划/提醒 → todo
- 含健康/运动/医疗/睡眠 → health
- 其他 → general
- account/password 没有就返回空字符串
- tags 最多3个`;

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    const clean=data.content[0].text.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    aiStatusText.textContent='AI 分析完成 ✓';

    const newNote={
      id:editingId||Date.now(),
      title:result.title||title,
      category:result.category||document.getElementById('noteCat').value,
      body:result.summary||body,
      time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'),
      account:result.account||'',
      password:result.password||'',
      tags:result.tags||[]
    };

    if(editingId){notes=notes.map(n=>n.id===editingId?newNote:n);}
    else{notes.unshift(newNote);}
    save();
    setTimeout(()=>{closeModal('newModal');renderNotes();aiStatus.style.display='none';},600);
  }catch(e){
    aiStatusText.textContent='已保存（离线模式）';
    const bodyText=body;
    let account='',password='';
    const accMatch=bodyText.match(/账号[:：]\s*(\S+)/);
    const pwdMatch=bodyText.match(/密码[:：]\s*(\S+)/);
    if(accMatch)account=accMatch[1];
    if(pwdMatch)password=pwdMatch[1];
    notes.unshift({id:Date.now(),title:title||'新笔记',category:document.getElementById('noteCat').value,body,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'),account,password,tags:[]});
    save();
    setTimeout(()=>{closeModal('newModal');renderNotes();aiStatus.style.display='none';},600);
  }
}

function openVoice(){
  voiceTranscript='';
  document.getElementById('voiceText').textContent='录音内容将显示在这里...';
  document.getElementById('voiceText').dataset.result='';
  document.getElementById('voiceStatus').textContent='点击开始录音';
  document.getElementById('voiceSaveBtn').style.display='none';
  document.getElementById('voiceAiStatus').style.display='none';
  document.getElementById('voiceRing').classList.remove('active');
  isRecording=false;
  openModal('voiceModal');
}

function toggleVoice(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    document.getElementById('voiceStatus').textContent='请使用 Chrome 浏览器以支持语音识别';
    return;
  }
  if(isRecording){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRecognition=new SR();
  voiceRecognition.lang='zh-CN';
  voiceRecognition.continuous=true;
  voiceRecognition.interimResults=true;
  voiceRecognition.onresult=e=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    voiceTranscript+=final;
    document.getElementById('voiceText').textContent=(voiceTranscript+interim)||'正在听...';
  };
  voiceRecognition.onerror=()=>{document.getElementById('voiceStatus').textContent='识别出错，请重试';stopVoice();};
  voiceRecognition.start();
  isRecording=true;
  document.getElementById('voiceRing').classList.add('active');
  document.getElementById('voiceStatus').textContent='正在录音... 点击停止';
}

function stopVoice(){
  if(voiceRecognition){voiceRecognition.stop();voiceRecognition=null;}
  isRecording=false;
  document.getElementById('voiceRing').classList.remove('active');
  document.getElementById('voiceStatus').textContent='录音完成';
  if(voiceTranscript){
    document.getElementById('voiceSaveBtn').style.display='block';
    processVoice(voiceTranscript);
  }
}

async function processVoice(text){
  const aiStatus=document.getElementById('voiceAiStatus');
  const aiText=document.getElementById('voiceAiText');
  aiStatus.style.display='flex';
  aiText.textContent='AI 正在理解语音内容...';
  try{
    const prompt=`将语音转文字整理成结构化笔记，严格返回JSON，无其他文字：
语音内容："${text}"
返回：{"category":"account|finance|todo|health|general","title":"简洁标题","body":"整理后的内容","account":"账号（如有）","password":"密码（如有）","tags":["标签"]}`;
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    const clean=data.content[0].text.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    aiText.textContent='AI 分析完成，点击保存 ✓';
    document.getElementById('voiceText').dataset.result=JSON.stringify(result);
    document.getElementById('voiceText').textContent=result.body;
  }catch(e){
    aiText.textContent='已记录原始语音内容';
  }
}

function saveVoiceNote(){
  let noteData;
  const raw=document.getElementById('voiceText').dataset.result;
  if(raw){try{noteData=JSON.parse(raw)}catch(e){}}
  if(!noteData){noteData={category:'general',title:'语音笔记 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),body:voiceTranscript,tags:['语音']};}
  notes.unshift({id:Date.now(),...noteData,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'),account:noteData.account||'',password:noteData.password||'',tags:noteData.tags||['语音']});
  save();closeModal('voiceModal');renderNotes();toast('语音笔记已保存 ✓');
}

function openPhoto(){
  document.getElementById('photoPreview').innerHTML='<div class="photo-placeholder">📷 点击下方选择或拍摄图片</div>';
  document.getElementById('photoAiStatus').style.display='none';
  document.getElementById('photoResult').style.display='none';
  document.getElementById('photoSaveBtn').style.display='none';
  document.getElementById('photoInput').value='';
  photoBase64='';
  openModal('photoModal');
}

function handlePhoto(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=e.target.result;
    photoBase64=b64.split(',')[1];
    document.getElementById('photoPreview').innerHTML=`<img src="${b64}" alt="照片">`;
    const aiStatus=document.getElementById('photoAiStatus');
    const aiText=document.getElementById('photoAiText');
    aiStatus.style.display='flex';
    aiText.textContent='AI 正在识别图片内容...';
    try{
      const prompt=`识别这张图片中的所有文字和关键信息，特别注意账号、密码、用户名、邮箱、金额、日期、联系方式等敏感信息。
以JSON返回：{"category":"account|finance|todo|health|general","title":"内容标题","body":"完整识别内容","account":"账号（如有）","password":"密码（如有）","tags":["标签"]}
严格只返回JSON，不要其他文字。`;
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:photoBase64}},{type:'text',text:prompt}]}]})
      });
      const data=await resp.json();
      const clean=data.content[0].text.replace(/```json|```/g,'').trim();
      const result=JSON.parse(clean);
      aiText.textContent='识别完成 ✓';
      document.getElementById('photoResultText').value=result.body;
      document.getElementById('photoResult').style.display='block';
      document.getElementById('photoSaveBtn').style.display='block';
      document.getElementById('photoSaveBtn').dataset.result=JSON.stringify(result);
    }catch(e){
      aiText.textContent='识别完成，请手动编辑';
      document.getElementById('photoResultText').value='请手动输入识别内容';
      document.getElementById('photoResult').style.display='block';
      document.getElementById('photoSaveBtn').style.display='block';
      document.getElementById('photoSaveBtn').dataset.result='';
    }
  };
  reader.readAsDataURL(file);
}

function savePhotoNote(){
  const raw=document.getElementById('photoSaveBtn').dataset.result;
  let noteData;
  if(raw){try{noteData=JSON.parse(raw)}catch(e){}}
  const body=document.getElementById('photoResultText').value;
  if(!noteData){noteData={category:'general',title:'照片识别 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),body,tags:['照片']};}
  notes.unshift({id:Date.now(),...noteData,body:body||noteData.body,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'),account:noteData.account||'',password:noteData.password||'',tags:noteData.tags||['照片']});
  save();closeModal('photoModal');renderNotes();toast('照片笔记已保存 ✓');
}

function showStats(){
  const counts={account:0,finance:0,todo:0,health:0,general:0};
  notes.forEach(n=>counts[n.category]=(counts[n.category]||0)+1);
  alert(`📊 笔记统计\n总计 ${notes.length} 条\n🔐 账号密码: ${counts.account} 条\n💰 财务: ${counts.finance} 条\n✅ 待办: ${counts.todo} 条\n❤️ 健康: ${counts.health} 条\n📝 笔记: ${counts.general} 条`);
}

document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');});
});

checkApiKey();
if(getApiKey()) document.getElementById('keyBtn').style.background='#4ade8020';
loadFromCloud();
